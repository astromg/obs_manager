[tool.poetry]
name = "obs_manager"
version = "0.1.1"
description = "OCM master plan manager"
authors = ["Marek Gorski <mgorski@camk.edu.pl>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
requests = "^2.28.1"
matplotlib = "^3.6.3"
astropy = "^6.0"

PyQt6 = "6.4.2"
PyQt6-Qt6 = "6.4.0"
PyQt6-sip = "13.6.0"

scipy = "^1.11"
numpy = "^2.1.0"

ephem = "^4.1.4"

pyaraucaria = {git = "https://github.com/araucaria-project/pyaraucaria.git"}
#pyaraucaria = { path = "./../pyaraucaria", develop = true }

tpg = { path = "./../tpg", develop = true }

[tool.poetry.scripts]
obs_manager = "obs_manager:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
